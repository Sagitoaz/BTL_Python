name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python-ci:
    name: Python Lint & Tests (mock Ollama)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check)
        run: mypy .

      - name: Pytest
        env:
          OLLAMA_URL: http://127.0.0.1:9999
          MODEL: tiny
          API_KEY: test-ci
        run: pytest -q --maxfail=1 --disable-warnings

  build-vsix:
    name: Build VSIX artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npm run compile --if-present

      - name: Package VSIX
        run: npx vsce package --no-dependencies --out out.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-copilot-${{ github.sha }}.vsix
          path: out.vsix
          if-no-files-found: error
